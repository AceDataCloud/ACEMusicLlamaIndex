name: Attach packages to a release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install . pytest build
      - run: python -m pytest
      - name: Verify the reviewed tag and build
        run: |
          python - <<'PYTHON'
          import os, tomllib
          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          if os.environ["RELEASE_TAG"] != "v" + version:
              raise SystemExit("Release tag and project version differ")
          PYTHON
          python -m build
      - run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz
